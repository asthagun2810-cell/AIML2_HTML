<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <fieldset>
        <legend>Biodata</legend>
        <form action="./response.html">
        <label for="name">UserName:</label>
         <input type="text" name="name" id="name" placeholder="Enter your name">
         <br><br>
         <label for="pass">Password:</label>
         <input type="password" name="pass" id="pass">
         <br><br>
         <label for="dob">DOB:</label>
         <input type="date" name="dob" id="dob">
         <br><br>
         <label for="gender">Gender:</label>
         <input type="radio" name="gender" id="male"><label for="gender">male</label>
        <input type="radio" name="gender" id="male"><label for="gender">female</label>
         <br><br>
         <label for="hobb">Hobbies:</label>
         <input type="checkbox" name="hobb1" id="hobb"><label for="hobb">cricket</label>
          <input type="checkbox" name="hobb2" id="hobb"><label for="hobb">football</label>
          <br><br>
          <label for="add">Address:</Address></label>
          <textarea name="add" id="add"></textarea>
          <br><br>
          <label for="tel">Phone:</label>
          <input type="tel" name="tel" id="tel">
          <br><br>
          <label for="email">Email:</label>
          <input type="email" name="email" id="email">
          <br><br>
          <label for="attempt">Attempte:</label>
          <input type="number" name="atte" id="att">
          <br><br>
          <label for="url">HomePage:</label>
          <input type="url" name="url" id="url">
          <br><br>
          <label for="file">Document:</label>
          <input type="file" name="file" id="file">
          <br><br>
          <input type="submit">
          <input type="reset">
          <label for="lang">Select Language:</Select></label>
          <select name="lang" id="lang">
            <option value=""></option>
            <option value="c">c</option>
            <option value="c++">c++</option>
            <option value="java">java</option>
            <option value="python">python</option>
          </select>
        </form>
    </fieldset>
</body>
</html>
